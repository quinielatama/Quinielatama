<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista oficial Quiniela Tama</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiniela Tama">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#243562">

<style>
  :root{--azul:#243562;--dorado:#8a6a1f;--claro:#b9c7e6;--verde:#1f9d55;--sel:#f2c230}
  *{box-sizing:border-box}
  body{margin:0;background:#fbf0d0;font-family:system-ui,Arial,sans-serif;color:#111}
  .wrap{max-width:760px;margin:0 auto;padding:12px}
  .nav{display:flex;gap:8px;margin-bottom:8px}
  .nav a{flex:1;text-align:center;padding:10px;border:2px solid #111;border-radius:10px;font-weight:800;color:#111;text-decoration:none;background:#fff}
  .nav a.on{background:var(--sel)}
  .head{background:var(--azul);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid #111}
  .head img{height:60px;width:auto}
  .head h1{margin:0;font-size:21px}
  .head .sub{font-size:13px;opacity:.9;margin-top:2px}
  .box{background:#fff;border:2px solid #111;border-top:0;padding:10px 12px;font-size:15px}
  .win{background:var(--sel);font-weight:800;font-size:17px}
  .info{background:#e6efff}
  .tools{display:flex;gap:8px;margin:10px 0}
  .tools input{flex:1;min-width:0;font-size:16px;padding:10px;border:2px solid #999;border-radius:10px}
  .tools select,.tools button{font-size:15px;padding:10px;border-radius:10px;border:2px solid #999;background:#fff}
  .tab{overflow:auto;max-height:72vh;border:2px solid #111;background:#fff}
  table{border-collapse:separate;border-spacing:0;font-size:11px;width:max-content;min-width:100%}
  th,td{border-right:1px solid #333;border-bottom:1px solid #333;text-align:center;padding:7px 3px;min-width:76px;font-weight:700;text-transform:uppercase}
  th{position:sticky;top:0;background:var(--dorado);color:#fff;z-index:2;padding:6px 3px}
  th .lg{display:flex;justify-content:center;gap:4px;align-items:center}
  th img,th .ini{width:24px;height:24px;object-fit:contain}
  th .ini{border-radius:50%;background:var(--azul);color:#fff;font-size:9px;display:inline-flex;align-items:center;justify-content:center}
  th .n{font-size:10px;margin-top:3px}
  td.nom,th.nom{position:sticky;left:0;min-width:120px;max-width:120px;z-index:1;font-size:12px;text-transform:none;word-break:break-word}
  th.nom{z-index:3}
  td.pts,th.pts{position:sticky;left:120px;min-width:44px;max-width:44px;z-index:1;font-size:14px;border-right:2px solid #111}
  th.pts{z-index:3}
  tr.par td{background:#fff}
  tr.imp td{background:var(--claro)}
  tr.res td{background:#ffe9a8}
  tr.gan td{background:var(--sel)}
  td.ok{background:#a8e0b4 !important}
  .nota,.vacio{color:#555;font-size:13px;margin:8px 2px}
  .aviso{background:#fff;border:2px solid #111;padding:14px;font-weight:700;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">Llenar quiniela</a><a class="on">Lista oficial</a></div>
  <div class="head"><img src="logo.png" alt="" onerror="this.remove()"><div><h1 id="t">Lista oficial</h1><div class="sub" id="sub"></div></div></div>
  <div id="banner"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Buscar mi nombre…">
    <select id="ord"><option value="llegada">Como llegaron</option><option value="aciertos">Por aciertos</option></select>
    <button id="act">⟳</button>
  </div>
  <div class="tab"><table id="tb"></table></div>
  <div class="nota" id="nota"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let D = null;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim(); }
const slug = n => norm(n).replace(/ /g, "");
function ini(n) { return n.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g, "").split(" ").filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
function escudo(eq) {
  return `<img src="logos/${slug(eq)}.png" alt="" onerror="this.outerHTML='<span class=&quot;ini&quot;>${esc(ini(eq))}</span>'">`;
}
function txtPick(par, p) { return p === "L" ? par[0] : p === "V" ? par[1] : p === "E" ? "Empate" : "—"; }

function pintar() {
  const n = D.partidos.length;
  const res = D.resultados || {};
  const hechos = Object.keys(res).filter(k => res[k]).length;
  let filas = D.quinielas.map((q, i) => {
    let a = 0;
    for (let k = 1; k <= n; k++) if (res[k] && q.p[k - 1] === res[k]) a++;
    return { n: q.n, p: q.p, a, i };
  });
  const orden = $("ord").value;
  if (orden === "aciertos") filas.sort((x, y) => y.a - x.a || x.i - y.i);
  const max = filas.reduce((m, f) => Math.max(m, f.a), 0);
  const terminado = n > 0 && hechos === n;
  const ganadores = terminado ? filas.filter(f => f.a === max) : [];

  $("t").textContent = `Quiniela Tama N°${D.num}`;
  const pub = D.publicado ? new Date(D.publicado).toLocaleString("es-MX", { timeZone: "America/Mexico_City", dateStyle: "medium", timeStyle: "short" }) : "";
  $("sub").textContent = D.qg ? `QG ${D.qg}` + (D.acum ? ` · Acumulado ${D.acum}` : "") : "";

  let b = "";
  if (terminado) {
    b += `<div class="box win">🏆 ${ganadores.length > 1 ? "GANADORES (empate)" : "GANADOR"}: ${ganadores.map(g => esc(g.n)).join(", ")} — ${max} de ${n} aciertos</div>`;
  } else if (hechos) {
    b += `<div class="box info">Resultados parciales: ${hechos} de ${n} partidos terminados.</div>`;
  }
  const datos = [D.cierre ? `Cierre: ${esc(D.cierre)}` : "", pub ? `Lista publicada: ${esc(pub)}` : ""].filter(Boolean);
  if (datos.length) b += `<div class="box info">${datos.join(" · ")}</div>`;
  $("banner").innerHTML = b;

  const f = norm($("q").value);
  let h = `<tr><th class="nom">PARTICIPANTE</th>` + (hechos ? `<th class="pts">PTS</th>` : "");
  D.partidos.forEach((par, k) => {
    h += `<th title="${esc(par[0])} vs ${esc(par[1])}"><div class="lg">${escudo(par[0])}${escudo(par[1])}</div><div class="n">${k + 1}</div></th>`;
  });
  h += `</tr>`;
  if (hechos) {
    h += `<tr class="res"><td class="nom">RESULTADO</td><td class="pts"></td>` + D.partidos.map((par, k) => `<td>${res[k + 1] ? esc(txtPick(par, res[k + 1])) : "—"}</td>`).join("") + `</tr>`;
  }
  filas.forEach((r, idx) => {
    if (f && !norm(r.n).includes(f)) return;
    const cls = terminado && r.a === max ? "gan" : idx % 2 ? "imp" : "par";
    h += `<tr class="${cls}"><td class="nom">${esc(r.n)}</td>` + (hechos ? `<td class="pts">${r.a}</td>` : "");
    D.partidos.forEach((par, k) => {
      const p = r.p[k], ok = res[k + 1] && p === res[k + 1];
      h += `<td class="${ok ? "ok" : ""}">${esc(txtPick(par, p))}</td>`;
    });
    h += `</tr>`;
  });
  $("tb").innerHTML = h;
  $("nota").textContent = hechos ? "En verde: aciertos. PTS = total de aciertos." : "Revisa que tu quiniela y tus picks estén correctos.";
}

async function cargar() {
  try {
    const r = await fetch("lista.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("sin lista");
    D = await r.json();
    $("ord").value = Object.values(D.resultados || {}).some(Boolean) ? "aciertos" : "llegada";
    pintar();
  } catch (e) {
    $("banner").innerHTML = '<div class="aviso">Aún no se publica la lista de esta jornada. Vuelve después del cierre.</div>';
    $("tb").innerHTML = ""; $("nota").textContent = "";
  }
}
$("q").addEventListener("input", () => D && pintar());
$("ord").addEventListener("change", () => D && pintar());
$("act").onclick = cargar;
cargar();
</script>
</body>
</html>
